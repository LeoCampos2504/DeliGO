name: F10-B2.2-E TESTING validation

on:
  push:
    branches:
      - testing-codex
      # CI-only run for the F4-A owner-bell fix before integration (no deploy step here;
      # Railway TESTING deploys only from testing-codex).
      - codex/f4-a-owner-bell-notification
      # CI-only run for F4-B (owner sale corrections) before integration; no deploy step.
      - codex/f4-b-owner-sale-corrections
      # CI-only run for the F4-B justified-replacement-prices fix before integration; no deploy step.
      - codex/f4-b-justified-prices
      # CI-only run for F4-C1 (sale/return engines composable in one transaction) before integration; no deploy step.
      - codex/f4-c1-transactional-engines
      # CI-only run for F4-C2 (Caja summaries read the money from the real cobros) before integration; no deploy step.
      - codex/f4-c2-cobro-based-reports
      # CI-only run for F4-C3 (data model and SQL invariants of commercial exchanges) before integration; no deploy step.
      - codex/f4-c3-sale-exchange-schema
      # CI-only run for F4-C4 (exchange service + API, linked additional sales) before integration; no deploy step.
      - codex/f4-c4-sale-exchange-service
      # CI-only run for F4-C5 (exchange UI, safe recovery of uncertain attempts, complete daily totals) before
      # integration; no deploy step.
      - codex/f4-c5-sale-exchange-ui

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deligo_test
          POSTGRES_PASSWORD: deligo_test
          POSTGRES_DB: deligo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deligo_test -d deligo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://deligo_test:deligo_test@127.0.0.1:5432/deligo_test?schema=public
      DELIGO_TEST_DATABASE_URL: postgresql://deligo_test:deligo_test@127.0.0.1:5432/deligo_test?schema=public
      DELIGO_ENVIRONMENT: TESTING
      DELIGO_EPHEMERAL_TEST_DB: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run prisma validate --schema prisma/schema.prisma
      - run: bun --no-env-file run prisma generate --schema prisma/schema.prisma
      - run: bun --no-env-file run prisma migrate deploy --schema prisma/schema.prisma
      # F4-B: next build ignores type errors, so typecheck the files this stage
      # touches against the freshly generated client (repo-wide baseline unchanged).
      # F4-C1: same check extended to the sale engine, the shared-transaction helper and its suites.
      # F4-C2: also the cobro summary helper, the shift summary, the updated static contracts and the F4-C2 suites.
      # F4-C3: also the prepared exchange constants (caja-venta.ts) and the F4-C3 suite (the return and sale
      # services touched by F4-C3 are already covered above).
      # F4-C4: also the exchange executor, the exchange service + HTTP layer, the return HTTP layer, the
      # updated f10-b2-1 contract, the owner and cashier exchange/additional-sale routes and the F4-C4 suites.
      # F4-C5: also the commercial-attempt store, the exchange breakdown, the exchange UI (+ thresholds, its
      # suites), the bell, the chain / thresholds / shift-detail / closed-shift routes, the cashier Caja page
      # and the F4-C5 suites (the verification routes are covered by the cambios|adicionales prefixes above).
      # «Gestionar venta» (2026-11-11): also the compact catalog picker, the shared idempotent POST and the return preview.
      # owner-caja-revisiones.tsx is NOT listed: it carries pre-existing (BigInt target) diagnostics.
      - name: Typecheck F4-B, F4-C1, F4-C2, F4-C3, F4-C4 and F4-C5 files
        run: |
          bunx tsc --noEmit -p tsconfig.json > tsc-output.txt || true
          if grep -E "^src/(lib/caja-correcciones|lib/caja-venta-vigente|lib/caja-devoluciones-service|lib/f4-b-correcciones|app/api/negocio/caja/ventas/\[id\]/correcciones|app/api/negocio/caja/ventas/route|components/business/caja-devoluciones|components/business/caja-correcciones|components/business/caja-tab|lib/caja-venta-service|lib/caja-transaccion-compartida|lib/f4-c1-transaccion-compartida|lib/caja-resumen-cobros|lib/caja-turnos-admin|lib/f4-c2-resumen-cobros|lib/f10-b0-static-contract|lib/f10-b2-0-static-contract|lib/caja-venta\.ts|lib/f4-c3-cambio-venta-schema|lib/caja-ejecutor-cambio|lib/caja-cambios|lib/caja-devoluciones-http|lib/f10-b2-1-static-contract|lib/f4-c4-|app/api/negocio/caja/ventas/\[id\]/(cambios|adicionales)|app/api/operativo/caja/\[slug\]/ventas/\[id\]/(cambios|adicionales)|lib/caja-intento-comercial|lib/caja-resumen-cambios|lib/f4-c5-|components/business/caja-cambios|components/shared/notification-center|app/api/negocio/caja/ventas/\[id\]/cadena|app/api/operativo/caja/\[slug\]/ventas/\[id\]/cadena|app/api/negocio/caja/configuracion-cambios|app/api/negocio/caja/turnos/\[id\]/route|app/api/negocio/caja/turnos/cerrados|app/operaciones/mi-panel/\[slug\]/caja/page|components/business/caja-catalogo-compacto|components/business/caja-post-idempotente|lib/caja-devolucion-estimado|lib/f4-c-auditoria-reintegro)" tsc-output.txt; then
            echo "TypeScript errors in F4-B / F4-C1 / F4-C2 / F4-C3 / F4-C4 / F4-C5 files"; exit 1
          fi
          echo "F4-B, F4-C1, F4-C2, F4-C3, F4-C4 and F4-C5 files typecheck clean ($(grep -c '^src/' tsc-output.txt) pre-existing diagnostics elsewhere)"
      # F4-C2: money by method from the real cobros, each suite in its own process, BEFORE the regression
      # batch below (which contains the known intermittent f10-b2-1-turnos:440) so their evidence is never
      # skipped by it; the integration suite writes only to the ephemeral postgres:16 service above.
      - run: bun --no-env-file test src/lib/caja-resumen-cobros.test.ts
      - run: bun --no-env-file test src/lib/f4-c2-resumen-cobros.integration.test.ts
      # F4-C3: SQL invariants of commercial exchanges (applied by migrate deploy above) against the ephemeral
      # postgres:16 service, in its own process and BEFORE the regression batch for the same reason as F4-C2.
      - run: bun --no-env-file test src/lib/f4-c3-cambio-venta-schema.integration.test.ts
      # F4-C4: exchange executor, exchange service/API and linked additional sales, each suite in its own
      # process and BEFORE the regression batch for the same reason as F4-C2; the integration suites write
      # only to the ephemeral postgres:16 service above (migration applied by migrate deploy). The F4-A audit
      # suite replaces the return service module process-wide, so it MUST keep its own process.
      - run: bun --no-env-file test src/lib/caja-ejecutor-cambio.test.ts
      - run: bun --no-env-file test src/lib/caja-cambios.test.ts
      - run: bun --no-env-file test src/lib/f4-c4-cambios.integration.test.ts
      - run: bun --no-env-file test src/lib/f4-c4-auditoria-f4a.integration.test.ts
      # Refund audit: commercial value returned vs money actually refunded (detalleVersion 2).
      - run: bun --no-env-file test src/lib/f4-c-auditoria-reintegro.integration.test.ts
      # F4-C5: commercial attempts (device store), verification and definitive closure of uncertain keys
      # (races against the confirmation on the ephemeral postgres:16 service, migration 20261110120000
      # applied by migrate deploy above), read-only links / chains / D7 breakdown / partial compensation,
      # complete daily totals over more than 100 sales (B1), static guarantees, the exchange UI and the
      # REAL selling-view picker. Each suite in its own process, BEFORE the regression batch for the same
      # reason as F4-C2; the selector suite replaces modules process-wide, so it MUST keep its own process.
      - run: bun --no-env-file test src/lib/caja-intento-comercial.test.ts
      - run: bun --no-env-file test src/lib/f4-c5-intentos.integration.test.ts
      - run: bun --no-env-file test src/lib/f4-c5-lecturas.integration.test.ts
      - run: bun --no-env-file test src/lib/f4-c5-resumen-completo.integration.test.ts
      - run: bun --no-env-file test src/lib/f4-c5-static-contract.test.ts
      - run: bun --no-env-file test src/components/business/caja-cambios.test.tsx
      - run: bun --no-env-file test src/components/business/caja-cambios.selector.test.tsx
      - run: bun --no-env-file test src/lib/stock-lifecycle.test.ts src/lib/caja-turnos.test.ts src/lib/caja-turnos-entrega.test.ts src/components/business/operational-shift-panel.test.tsx src/components/business/owner-caja-revisiones.test.tsx src/components/business/owner-caja-recuperacion.test.tsx src/lib/caja-devoluciones.test.ts src/components/business/caja-devoluciones.test.tsx src/lib/f10-b0-static-contract.test.ts src/lib/f10-b2-1-static-contract.test.ts src/lib/f10-b2-0-static-contract.test.ts src/lib/f10-b2-1-turnos.integration.test.ts src/lib/f4-a-devoluciones.integration.test.ts src/lib/caja-correcciones.test.ts src/components/business/caja-correcciones.test.tsx src/lib/f4-b-correcciones.integration.test.ts
      # Separate process: this file imports the bell (Radix) without a DOM and must not share
      # the module cache with the happy-dom UI suites above (F4-A owner-bell fix).
      - run: bun --no-env-file test src/components/shared/notification-center.test.ts
      # F4-B P2-A: real CajaTab with process-wide module mocks (sonner, scanner) → own process.
      - run: bun --no-env-file test src/components/business/caja-tab.correcciones.test.tsx
      # F4-C1: sale + return engines composed in one Serializable transaction, each suite in its
      # own process; the integration suite writes only to the ephemeral postgres:16 service above.
      - run: bun --no-env-file test src/lib/f4-c1-transaccion-compartida.test.ts
      - run: bun --no-env-file test src/lib/f4-c1-transaccion-compartida.integration.test.ts
      - run: bun --no-env-file run build

