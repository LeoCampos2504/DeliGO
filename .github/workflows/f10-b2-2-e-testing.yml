name: F10-B2.2-E TESTING validation

on:
  push:
    branches:
      - testing-codex
      # CI-only run for the F4-A owner-bell fix before integration (no deploy step here;
      # Railway TESTING deploys only from testing-codex).
      - codex/f4-a-owner-bell-notification
      # CI-only run for F4-B (owner sale corrections) before integration; no deploy step.
      - codex/f4-b-owner-sale-corrections
      # CI-only run for the F4-B justified-replacement-prices fix before integration; no deploy step.
      - codex/f4-b-justified-prices
      # CI-only run for F4-C1 (sale/return engines composable in one transaction) before integration; no deploy step.
      - codex/f4-c1-transactional-engines
      # CI-only run for F4-C2 (Caja summaries read the money from the real cobros) before integration; no deploy step.
      - codex/f4-c2-cobro-based-reports
      # CI-only run for F4-C3 (data model and SQL invariants of commercial exchanges) before integration; no deploy step.
      - codex/f4-c3-sale-exchange-schema
      # CI-only run for F4-C4 (exchange service + API, linked additional sales) before integration; no deploy step.
      - codex/f4-c4-sale-exchange-service
      # CI-only run for F4-C5 (exchange UI, safe recovery of uncertain attempts, complete daily totals) before
      # integration; no deploy step.
      - codex/f4-c5-sale-exchange-ui
      # CI-only run for the integration of F5-A, F10-C2a/b/c, supplier payments E1–E3 and the catalog for real
      # businesses (product↔supplier, temporary employee permissions, Excel/CSV import) before integration; no deploy
      # step (Railway TESTING deploys only from testing-codex).
      - codex/integracion-compras-catalogo
      # CI-only run for BUG-001 (single linked-employee identity rule) and BUG-002 (table occupancy with owner and
      # operational sessions in the same browser) before integration; no deploy step.
      - codex/fix-identidad-ocupacion
      # CI-only run for the final stabilization (T1 interface fixes; later T2/T3) before integration; no deploy step
      # (Railway TESTING deploys only from testing-codex).
      - codex/estabilizacion-final

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deligo_test
          POSTGRES_PASSWORD: deligo_test
          POSTGRES_DB: deligo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deligo_test -d deligo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://deligo_test:deligo_test@127.0.0.1:5432/deligo_test?schema=public
      DELIGO_TEST_DATABASE_URL: postgresql://deligo_test:deligo_test@127.0.0.1:5432/deligo_test?schema=public
      DELIGO_ENVIRONMENT: TESTING
      DELIGO_EPHEMERAL_TEST_DB: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run prisma validate --schema prisma/schema.prisma
      - run: bun --no-env-file run prisma generate --schema prisma/schema.prisma
      # Historical migration utility clients are generated only in this isolated CI install.
      - run: bun --no-env-file run prisma generate --schema prisma/schema.sqlite.prisma
      - run: bun --no-env-file run prisma generate --schema prisma/schema.postgres.prisma
      - run: bun --no-env-file run prisma migrate deploy --schema prisma/schema.prisma
      # F4-B: next build ignores type errors, so typecheck the files this stage
      # touches against the freshly generated client (repo-wide baseline unchanged).
      # F4-C1: same check extended to the sale engine, the shared-transaction helper and its suites.
      # F4-C2: also the cobro summary helper, the shift summary, the updated static contracts and the F4-C2 suites.
      # F4-C3: also the prepared exchange constants (caja-venta.ts) and the F4-C3 suite (the return and sale
      # services touched by F4-C3 are already covered above).
      # F4-C4: also the exchange executor, the exchange service + HTTP layer, the return HTTP layer, the
      # updated f10-b2-1 contract, the owner and cashier exchange/additional-sale routes and the F4-C4 suites.
      # F4-C5: also the commercial-attempt store, the exchange breakdown, the exchange UI (+ thresholds, its
      # suites), the bell, the chain / thresholds / shift-detail / closed-shift routes, the cashier Caja page
      # and the F4-C5 suites (the verification routes are covered by the cambios|adicionales prefixes above).
      # «Gestionar venta» (2026-11-11): also the compact catalog picker, the shared idempotent POST and the return preview.
      # F10-C1 (cash outflows C1a/C1b/C1c): also the outflow service + HTTP layer, the owner and cashier outflow
      # routes, the threshold route, the cashier and owner outflow UIs, the shift breakdown, the install notice,
      # the shift panel (not its test: pre-existing diagnostics) and the F10-C1 suites.
      # owner-caja-revisiones.tsx is NOT listed: it carries pre-existing (BigInt target) diagnostics.
      # F5-A (suppliers + single ledger/assignment engine): CUIT, the supplier and ledger services, the HTTP layer,
      # the owner routes, the owner panel and the F5-A suites.
      # Integration (compras/catálogo): price labels and sale-start prices, supplier payments E1–E3, product↔supplier,
      # employee catalog permissions and the Excel/CSV importer (new files must typecheck clean as well).
      # BUG-001/BUG-002: the identity module, the occupancy actor resolution + route + client/control, the operational
      # auth context and the new suites.
      - name: Typecheck F4-B, F4-C1, F4-C2, F4-C3, F4-C4, F4-C5 and F10-C1 files
        run: |
          set +e
          bunx tsc --noEmit -p tsconfig.json > tsc-output.txt
          tsc_status=$?
          set -e
          if grep -E "^src/(lib/caja-correcciones|lib/caja-venta-vigente|lib/caja-devoluciones-service|lib/f4-b-correcciones|app/api/negocio/caja/ventas/\[id\]/correcciones|app/api/negocio/caja/ventas/route|components/business/caja-devoluciones|components/business/caja-correcciones|components/business/caja-tab|lib/caja-venta-service|lib/caja-transaccion-compartida|lib/f4-c1-transaccion-compartida|lib/caja-resumen-cobros|lib/caja-turnos-admin|lib/f4-c2-resumen-cobros|lib/f10-b0-static-contract|lib/f10-b2-0-static-contract|lib/caja-venta\.ts|lib/f4-c3-cambio-venta-schema|lib/caja-ejecutor-cambio|lib/caja-cambios|lib/caja-devoluciones-http|lib/f10-b2-1-static-contract|lib/f4-c4-|app/api/negocio/caja/ventas/\[id\]/(cambios|adicionales)|app/api/operativo/caja/\[slug\]/ventas/\[id\]/(cambios|adicionales)|lib/caja-intento-comercial|lib/caja-resumen-cambios|lib/f4-c5-|components/business/caja-cambios|components/shared/notification-center|app/api/negocio/caja/ventas/\[id\]/cadena|app/api/operativo/caja/\[slug\]/ventas/\[id\]/cadena|app/api/negocio/caja/configuracion-cambios|app/api/negocio/caja/turnos/\[id\]/route|app/api/negocio/caja/turnos/cerrados|app/operaciones/mi-panel/\[slug\]/caja/page|components/business/caja-catalogo-compacto|components/business/caja-post-idempotente|lib/caja-devolucion-estimado|lib/f4-c-auditoria-reintegro|lib/f4-c-reintegro-concurrente|lib/f4-c-medio-reintegro|components/business/caja-medio-reintegro|lib/caja-egresos-|lib/f10-c1|app/api/negocio/caja/egresos|app/api/negocio/caja/configuracion-egresos|app/api/operativo/caja/\[slug\]/egresos|components/business/caja-salidas-cajero|components/business/caja-cajero-secciones|components/business/owner-caja-egresos|components/business/owner-caja-desglose-turno|components/shared/install-prompt|components/business/operational-shift-panel\.tsx|lib/cuit|lib/proveedores-service|lib/cuenta-proveedor-|lib/f5a-|app/api/negocio/proveedores|components/business/owner-proveedores|lib/compras-|lib/f10-c2a-|lib/f10-c2b-|lib/r3a-f4-|lib/stock-lifecycle|lib/caja-devoluciones-service|lib/caja-correcciones-service|components/business/recepcion|components/business/owner-compras|app/operaciones/mi-panel/\[slug\]/recepciones|app/api/negocio/recepciones|app/api/negocio/compras|app/api/operativo/caja/\[slug\]/recepciones|lib/etiquetas-precio|lib/precios-venta|lib/precios-etiquetas|lib/inicio-venta|lib/pagos-pedido|lib/anticipos-pedido|lib/recepcion-pagos|lib/proveedor-productos|lib/catalogo-empleado|lib/importacion-|lib/caja-venta-service|proxy\.ts|components/business/(etiquetas-precio-lista|cuenta-proveedor-pedidos|importar-productos|permisos-catalogo|producto-proveedores|inventario-tab)|app/api/negocio/(etiquetas-precio|empleados/permisos-catalogo|productos|caja/ventas/inicio)|app/api/operativo/caja/\[slug\]/(catalogo|etiquetas-precio|pedidos|ventas/inicio|ventas/route|recepciones-datos)|app/operaciones/mi-panel/\[slug\]/(etiquetas|productos)|app/negocio/importar-productos|lib/empleado-identidad|lib/mesa-occupancy|lib/mesa-ocupacion-familia|app/api/operaciones/mesas/\[id\]/ocupacion|components/operativo/mesa-occupancy-control|lib/operativo-mozo)" tsc-output.txt; then
            echo "TypeScript errors in F4-B / F4-C1 / F4-C2 / F4-C3 / F4-C4 / F4-C5 / F10-C1 files"; exit 1
          fi
          if grep -E '^src/(app/mozo/|components/shared/permission-prompt\.tsx|components/superadmin/promocionados-tab\.tsx|lib/push\.ts)' tsc-output.txt; then
            echo "TypeScript errors in files corrected during T2 continuation"; exit 1
          fi
          if [ "$tsc_status" -eq 0 ]; then
            echo "F4-B, F4-C1, F4-C2, F4-C3, F4-C4, F4-C5 and F10-C1 files typecheck clean; full typecheck is clean."
          else
            echo "Scoped files typecheck clean; the required full-project typecheck at the end will report and fail on remaining diagnostics."
          fi
      # F4-C2: money by method from the real cobros, each suite in its own process, BEFORE the regression
      # batch below (which contains the known intermittent f10-b2-1-turnos:440) so their evidence is never
      # skipped by it; the integration suite writes only to the ephemeral postgres:16 service above.
      - run: bun --no-env-file test src/lib/caja-resumen-cobros.test.ts
      - run: bun --no-env-file test src/lib/f4-c2-resumen-cobros.integration.test.ts
      # C5: fail closed unless the declared ephemeral database is in use.
      - run: bun --no-env-file test src/lib/f10-c2c-inicio-vencido.integration.test.ts
      # T2 import: independent processes and isolated PostgreSQL; no silent skips.
      - run: bun --no-env-file test src/lib/t2-importacion-formatos.test.ts
      - run: bun --no-env-file test src/lib/t2-importacion.integration.test.ts
      - run: bun --no-env-file test src/lib/t2-catalogo.integration.test.ts
      - run: bun --no-env-file test src/lib/t2-permisos-concurrencia.integration.test.ts
      - run: bun --no-env-file test src/lib/t2-venta-sin-precio.integration.test.ts
      - run: bun --no-env-file test src/lib/f10-b1-static-contract.test.ts
      - run: bun --no-env-file test src/lib/f9-barcode-static-contract.test.ts
      - run: bun --no-env-file test src/lib/stock-lifecycle-i3.test.ts
      # F4-C3: SQL invariants of commercial exchanges (applied by migrate deploy above) against the ephemeral
      # postgres:16 service, in its own process and BEFORE the regression batch for the same reason as F4-C2.
      - run: bun --no-env-file test src/lib/f4-c3-cambio-venta-schema.integration.test.ts
      # F4-C4: exchange executor, exchange service/API and linked additional sales, each suite in its own
      # process and BEFORE the regression batch for the same reason as F4-C2; the integration suites write
      # only to the ephemeral postgres:16 service above (migration applied by migrate deploy). The F4-A audit
      # suite replaces the return service module process-wide, so it MUST keep its own process.
      - run: bun --no-env-file test src/lib/caja-ejecutor-cambio.test.ts
      - run: bun --no-env-file test src/lib/caja-cambios.test.ts
      - run: bun --no-env-file test src/lib/f4-c4-cambios.integration.test.ts
      - run: bun --no-env-file test src/lib/f4-c4-auditoria-f4a.integration.test.ts
      # Refund audit: commercial value returned vs money actually refunded (detalleVersion 2).
      - run: bun --no-env-file test src/lib/f4-c-auditoria-reintegro.integration.test.ts
      # Pending refund paid CONCURRENTLY (two sessions / tabs / devices, same or different keys): exactly
      # one payment, one outflow and one audit event; the losers are refused or replayed, never a 500.
      - run: bun --no-env-file test src/lib/f4-c-reintegro-concurrente.integration.test.ts
      # Refund method: the method stored, the cash moved, the shift and the audit follow EXACTLY the method
      # sent (never the sale's own); no method → refused; OPCIONAL / OBLIGATORIO and blind close unchanged.
      - run: bun --no-env-file test src/lib/f4-c-medio-reintegro.integration.test.ts
      # UI: the refund method is never preselected and must be chosen explicitly (return, exchange, later payment, void).
      - run: bun --no-env-file test src/components/business/caja-medio-reintegro.test.tsx
      # F4-C5: commercial attempts (device store), verification and definitive closure of uncertain keys
      # (races against the confirmation on the ephemeral postgres:16 service, migration 20261110120000
      # applied by migrate deploy above), read-only links / chains / D7 breakdown / partial compensation,
      # complete daily totals over more than 100 sales (B1), static guarantees, the exchange UI and the
      # REAL selling-view picker. Each suite in its own process, BEFORE the regression batch for the same
      # reason as F4-C2; the selector suite replaces modules process-wide, so it MUST keep its own process.
      - run: bun --no-env-file test src/lib/caja-intento-comercial.test.ts
      - run: bun --no-env-file test src/lib/f4-c5-intentos.integration.test.ts
      - run: bun --no-env-file test src/lib/f4-c5-lecturas.integration.test.ts
      - run: bun --no-env-file test src/lib/f4-c5-resumen-completo.integration.test.ts
      - run: bun --no-env-file test src/lib/f4-c5-static-contract.test.ts
      - run: bun --no-env-file test src/components/business/caja-cambios.test.tsx
      - run: bun --no-env-file test src/components/business/caja-cambios.selector.test.tsx
      - run: bun --no-env-file test src/lib/stock-lifecycle.test.ts src/lib/caja-turnos.test.ts src/lib/caja-turnos-entrega.test.ts src/components/business/operational-shift-panel.test.tsx src/components/business/owner-caja-revisiones.test.tsx src/components/business/owner-caja-recuperacion.test.tsx src/lib/caja-devoluciones.test.ts src/components/business/caja-devoluciones.test.tsx src/lib/f10-b0-static-contract.test.ts src/lib/f10-b2-1-static-contract.test.ts src/lib/f10-b2-0-static-contract.test.ts src/lib/f10-b2-1-turnos.integration.test.ts src/lib/f4-a-devoluciones.integration.test.ts src/lib/caja-correcciones.test.ts src/components/business/caja-correcciones.test.tsx src/lib/f4-b-correcciones.integration.test.ts
      # Separate process: this file imports the bell (Radix) without a DOM and must not share
      # the module cache with the happy-dom UI suites above (F4-A owner-bell fix).
      - run: bun --no-env-file test src/components/shared/notification-center.test.ts
      # F4-B P2-A: real CajaTab with process-wide module mocks (sonner, scanner) → own process.
      - run: bun --no-env-file test src/components/business/caja-tab.correcciones.test.tsx
      # F4-C1: sale + return engines composed in one Serializable transaction, each suite in its
      # own process; the integration suite writes only to the ephemeral postgres:16 service above.
      - run: bun --no-env-file test src/lib/f4-c1-transaccion-compartida.test.ts
      - run: bun --no-env-file test src/lib/f4-c1-transaccion-compartida.integration.test.ts
      # F10-C1 (cash outflows): engine + SQL guards + R1 audits + owner supervision / compensations / reports on
      # the ephemeral postgres:16 service above, then the static contracts and the cashier / owner UIs (happy-dom),
      # each in its own process.
      - run: bun --no-env-file test src/lib/f10-c1a-egresos.integration.test.ts
      - run: bun --no-env-file test src/lib/f10-c1a-egresos-r1.integration.test.ts
      - run: bun --no-env-file test src/lib/f10-c1c-egresos.integration.test.ts
      - run: bun --no-env-file test src/lib/f10-c1a-static-contract.test.ts src/lib/f10-c1b-static-contract.test.ts src/lib/f10-c1c-static-contract.test.ts
      - run: bun --no-env-file test src/components/business/caja-salidas-cajero.test.tsx
      - run: bun --no-env-file test src/components/business/owner-caja-egresos.test.tsx
      - run: bun --no-env-file test "src/app/operaciones/mi-panel/[slug]/caja/page.test.tsx"
      # T1 (stabilization, presentation only): the cashier sections follow the confirmed shift without remounting the
      # sale (REAL VenderView: cart and sale start survive opening/closing), expired catalog permissions start
      # unchecked, the variant dialog shows the saved price, the supplier texts/amounts/contextual forms/«Todas las
      # variantes», and the import limits taken from the shared constants. Module mocks → each UI suite in its own process.
      - run: bun --no-env-file test "src/app/operaciones/mi-panel/[slug]/caja/page.secciones.test.tsx"
      - run: bun --no-env-file test src/components/business/permisos-catalogo.test.tsx
      - run: bun --no-env-file test src/components/business/inventario-tab.variantes.test.tsx
      - run: bun --no-env-file test src/components/business/cuenta-proveedor-pedidos.test.ts src/components/business/importar-productos.limites.test.ts
      # F5-A (suppliers + single ledger/assignment engine; links F10-C1 supplier payments and blocks their
      # compensation while linked): engine + SQL guards on the ephemeral postgres:16 service, then the pure,
      # static-contract and owner-panel (happy-dom) suites, each in its own process.
      - run: bun --no-env-file test src/lib/f5a-cuenta-proveedor.integration.test.ts
      - run: bun --no-env-file test src/lib/cuit.test.ts src/lib/f5a-static-contract.test.ts
      - run: bun --no-env-file test src/components/business/owner-proveedores.test.tsx
      # F10-C2a (purchases + goods receptions: owner approval moves R3A stock, frozen costs and ONE F5 obligation
      # atomically): engine + SQL guards on the ephemeral postgres:16 service, then the pure cost and static suites.
      - run: bun --no-env-file test src/lib/f10-c2a-recepciones.integration.test.ts
      - run: bun --no-env-file test src/lib/compras-calculo.test.ts src/lib/f10-c2a-static-contract.test.ts
      # R3A single stock authority (F4-A returns/voids and F4-B corrections now write stock only through
      # stock-lifecycle.ts) + F10-C2b reception UIs (cashier «Recibir mercadería», owner tray/approval, D-7 cash payment).
      - run: bun --no-env-file test src/lib/r3a-f4-autoridad.integration.test.ts
      - run: bun --no-env-file test src/lib/r3a-f4-autoridad-static-contract.test.ts src/lib/f10-c2b-static-contract.test.ts
      - run: bun --no-env-file test src/components/business/recepciones-c2b.test.tsx
      # BUG-001: single visible identity of linked employees (unit + real PostgreSQL: one account in two businesses,
      # truly pending employee, isolation, preservation, new waiter orders) and the suites updated to the approved rule.
      - run: bun --no-env-file test src/lib/empleado-identidad.test.ts
      - run: bun --no-env-file test src/lib/empleado-identidad.integration.test.ts
      - run: bun --no-env-file test src/lib/caja-nombre-empleado.integration.test.ts
      - run: bun --no-env-file test src/lib/f10-b1-cashier.integration.test.ts
      # BUG-002: occupancy actor resolved by the declared session family (owner + operational cookies together),
      # 401/403/404/400 distinguished; occupancy parity and refresh contracts updated.
      - run: bun --no-env-file test src/lib/mesa-ocupacion-familia.integration.test.ts
      - run: bun --no-env-file test src/lib/p2-t48-salon-personal-occupation-parity.integration.test.ts
      - run: bun --no-env-file test src/lib/p2-t53-negocio-occupation-refresh.test.ts
      # BUG-003: customer-view surfaces — owner session must match the business (other business → 404) and no employee
      # names, internal codes or operational-account data are exposed (mesas-public, by-codigo).
      - run: bun --no-env-file test src/lib/bug003-superficies-publicas.integration.test.ts
      # Full project typecheck: diagnostics anywhere must fail the candidate.
      - name: Typecheck completo
        run: bunx tsc --noEmit --incremental false --pretty false
      - run: bun --no-env-file run build

