name: F10-B2.2-E TESTING validation

on:
  push:
    branches:
      - testing-codex
      # CI-only run for the F4-A owner-bell fix before integration (no deploy step here;
      # Railway TESTING deploys only from testing-codex).
      - codex/f4-a-owner-bell-notification

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deligo_test
          POSTGRES_PASSWORD: deligo_test
          POSTGRES_DB: deligo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deligo_test -d deligo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://deligo_test:deligo_test@127.0.0.1:5432/deligo_test?schema=public
      DELIGO_TEST_DATABASE_URL: postgresql://deligo_test:deligo_test@127.0.0.1:5432/deligo_test?schema=public
      DELIGO_ENVIRONMENT: TESTING
      DELIGO_EPHEMERAL_TEST_DB: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run prisma validate --schema prisma/schema.prisma
      - run: bun --no-env-file run prisma generate --schema prisma/schema.prisma
      - run: bun --no-env-file run prisma migrate deploy --schema prisma/schema.prisma
      - run: bun --no-env-file test src/lib/stock-lifecycle.test.ts src/lib/caja-turnos.test.ts src/lib/caja-turnos-entrega.test.ts src/components/business/operational-shift-panel.test.tsx src/components/business/owner-caja-revisiones.test.tsx src/components/business/owner-caja-recuperacion.test.tsx src/lib/caja-devoluciones.test.ts src/components/business/caja-devoluciones.test.tsx src/lib/f10-b0-static-contract.test.ts src/lib/f10-b2-1-static-contract.test.ts src/lib/f10-b2-0-static-contract.test.ts src/lib/f10-b2-1-turnos.integration.test.ts src/lib/f4-a-devoluciones.integration.test.ts
      - run: bun --no-env-file run build

